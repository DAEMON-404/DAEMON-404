name: Contribution Radar

on:
  schedule:
    - cron: "30 0 * * *"
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate contribution radar SVG
        run: node scripts/contribution-radar.mjs DAEMON-404 dist/contribution-radar.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ghaction-github-pages replaces the whole target branch with build_dir,
      # so this uses its own branch and must not share one with snake.yml.
      - name: Push to charts branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: charts
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
