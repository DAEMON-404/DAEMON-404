<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DEGREE_TELEMETRY — BSc (Hons) Ethical Hacking, Abertay, 2:1</title>
<!-- 440x280 CSS px, rendered at 2x → 880x560 -->
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_card.css">
<style>
  body { width:440px; height:280px; padding:24px 24px 0 24px; }
  .top { display:flex; justify-content:space-between; align-items:center; }
  .hero { margin-top:12px; display:flex; align-items:baseline; gap:16px; }
  .hero .cls { font-size:56px; font-weight:800; line-height:1; letter-spacing:-.02em; }
  .hero .deg { font-size:12px; letter-spacing:.18em; color:var(--gold); text-transform:uppercase; font-weight:500; line-height:1.5; }
  .sub { margin-top:8px; line-height:1; font-size:11.5px; letter-spacing:.14em; color:var(--muted); text-transform:uppercase; white-space:nowrap; }
  .sub b { color:var(--text); font-weight:500; }
  .bar { margin-top:14px; height:4px; background:#2b2433; position:relative; }
  .bar i { position:absolute; left:0; top:0; bottom:0; width:100%;
    background:linear-gradient(90deg, var(--rose), var(--gold) 45%, var(--foam)); }
  .bar b { position:absolute; right:-1px; top:-3px; width:2px; height:10px; background:var(--foam); }
  .barlbl { margin-top:8px; line-height:1; font-size:11.5px; letter-spacing:.18em; color:var(--muted); text-transform:uppercase; white-space:nowrap; }
  .stats { position:absolute; left:24px; right:24px; bottom:26px; display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }
  .stat .v { font-size:22px; }
</style>
</head>
<body>
  <div class="stripe"></div>
  <div class="top">
    <div class="label">Degree_Telemetry</div>
    <div class="pill">Graduated</div>
  </div>
  <div class="hero">
    <div class="cls glow">2:1</div>
    <div class="deg">Second Class<br>Upper Division</div>
  </div>
  <div class="sub"><b>BSc (Hons) Ethical Hacking</b> · Abertay University</div>
  <div class="bar"><i></i><b></b></div>
  <div class="barlbl">May 2022 → 10 Jul 2026 · 100% complete</div>
  <div class="stats">
    <div class="stat"><div class="v">NCSC</div><div class="k">Certified</div></div>
    <div class="stat iris"><div class="v">4 yrs</div><div class="k">Honours</div></div>
    <div class="stat foam"><div class="v">AEHS</div><div class="k">Society</div></div>
  </div>
</body>
</html>
